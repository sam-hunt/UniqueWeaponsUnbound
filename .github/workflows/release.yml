name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check translations
        # Deterministic localization gate: every shipped language must cover
        # the full expected key set from Scripts/expected-injections.json — a
        # checked-in dump of every DefInjected key the live game expects,
        # generated by the L10nProbe dev mod via the game's own walker (so it
        # includes text inherited from vanilla defs or defaulted in C#, which
        # never appears in this repo's XML). The checker also fails when the
        # sidecar is stale against Defs/, and the release skill regenerates it
        # every release, so there is no manual backstop anymore: the probe is
        # the backstop.
        run: python3 Scripts/check-translations.py

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build UniqueWeaponsUnbound.sln -c Release

      - name: Stage mod files
        # Reuse the .csproj's StageMod target — the single source of truth for what
        # files constitute the mod — so the release zip can never drift from the
        # local deploy (e.g. forget Patches). StageMod wipes + recopies $(StageDir).
        run: >
          dotnet build Source/1.6/UniqueWeaponsUnbound.csproj -c Release
          -t:StageMod -p:StageDir=${{ github.workspace }}/release/UniqueWeaponsUnbound

      - name: Package mod
        run: |
          set -e
          cd release && zip -r ../UniqueWeaponsUnbound-${GITHUB_REF_NAME}.zip UniqueWeaponsUnbound

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: UniqueWeaponsUnbound-${{ github.ref_name }}.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, '-rc') }}
